    <!-- i18n Script -->
    <script>
        let currentLang = localStorage.getItem('preferred-language') || 'zh';
        let i18nData = null;

        async function loadI18nData() {
            try {
                const possiblePaths = ['/data/i18n.json', 'data/i18n.json', '../data/i18n.json', '../../data/i18n.json', '../../../data/i18n.json'];
                for (const path of possiblePaths) {
                    try {
                        const response = await fetch(path);
                        if (response.ok) {
                            i18nData = await response.json();
                            applyLanguage(currentLang);
                            break;
                        }
                    } catch (e) { continue; }
                }
            } catch (error) {
                console.warn('无法加载语言数据:', error);
            }
        }

        function t(key, lang = currentLang, params = {}) {
            if (!i18nData) return key;
            const keys = key.split('.');
            let value = i18nData[lang];
            for (const k of keys) {
                if (value && value[k]) value = value[k];
                else return key;
            }
            if (typeof value === 'string' && params) {
                Object.keys(params).forEach(param => {
                    value = value.replace(`{${param}}`, params[param]);
                });
            }
            return value;
        }

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferred-language', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('[data-i18n-key]').forEach(element => {
                const key = element.getAttribute('data-i18n-key');
                const paramsAttr = element.getAttribute('data-i18n-params');
                let params = {};
                if (paramsAttr) {
                    try { params = JSON.parse(paramsAttr); }
                    catch (e) {
                        const count = element.getAttribute('data-count');
                        if (count) params = { count: count };
                    }
                }
                const text = t(key, lang, params);
                if (text && text !== key) element.textContent = text;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadI18nData();
        });
    </script>
