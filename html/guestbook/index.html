<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 梁庭威</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../../../logo.jpg">
    <link rel="apple-touch-icon" href="../../../logo.jpg">
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入ScrollReveal -->
    <script src="https://unpkg.com/scrollreveal@4.0.9/dist/scrollreveal.min.js"></script>
    
    <!-- Docker 风格配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        docker: {
                            blue: '#006FE6',
                            darkBlue: '#092953',
                            lightBlue: '#F0F6FF',
                            bg: '#ffffff',
                            text: '#1D2D35',
                            gray: '#8D9EA9',
                            border: '#E1E4E8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Roboto', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .bg-dots {
                background-image: radial-gradient(#E1E4E8 1px, transparent 1px);
                background-size: 20px 20px;
            }
            .card-hover {
                transition: all 0.2s ease-in-out;
            }
            .card-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
                border-color: #006FE6;
            }
        }
    </style>
</head>
<body class="font-sans text-docker-text antialiased bg-white">
    <!-- 导航栏 -->
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-docker-border">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="../../../home.html" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-docker-blue rounded flex items-center justify-center text-white font-bold group-hover:bg-blue-600 transition-colors">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight group-hover:text-docker-blue transition-colors">留言板</span>
                </a>
                
                <div class="flex items-center gap-4">
                    <a href="../home.html" 
                       class="text-sm font-medium px-4 py-2 rounded-lg transition-colors text-docker-gray hover:text-docker-blue hover:bg-docker-lightBlue">
                        <i class="fa-solid fa-arrow-left mr-1"></i>
                        返回首页
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面头部 -->
    <header class="relative pt-20 pb-16 bg-dots">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-white pointer-events-none"></div>
        <div class="container mx-auto px-6 text-center relative z-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-6 text-docker-darkBlue tracking-tight reveal-element">
                留言板
            </h1>
            <p class="text-xl text-docker-gray max-w-2xl mx-auto leading-relaxed reveal-element" data-sr-delay="100">
                欢迎留下您的想法、建议或问题，我会尽快回复
            </p>
        </div>
    </header>

    <!-- 留言表单区域 -->
    <section class="py-12 px-6">
        <div class="container mx-auto max-w-2xl">
            <div class="bg-white border border-docker-border rounded-lg shadow-sm p-8 reveal-element" data-sr-delay="200">
                <div class="flex items-center gap-4 mb-8 pb-6 border-b border-docker-border">
                    <div class="w-12 h-12 bg-docker-lightBlue rounded-lg flex items-center justify-center text-docker-blue text-xl">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-docker-text">留下您的留言</h2>
                        <p class="text-docker-gray text-sm">分享您的想法、建议或问题</p>
                    </div>
                </div>
                
                <form id="guestbook-form" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-docker-text mb-2">
                            姓名 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="name" name="name" required
                               placeholder="请输入您的姓名"
                               class="w-full px-4 py-2.5 rounded-lg border border-docker-border focus:border-docker-blue focus:ring-2 focus:ring-docker-blue/20 outline-none transition-all placeholder-gray-400">
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-docker-text mb-2">
                            邮箱（可选）
                        </label>
                        <input type="email" id="email" name="email"
                               placeholder="请输入您的邮箱（可选）"
                               class="w-full px-4 py-2.5 rounded-lg border border-docker-border focus:border-docker-blue focus:ring-2 focus:ring-docker-blue/20 outline-none transition-all placeholder-gray-400">
                    </div>
                    
                    <div>
                        <label for="message" class="block text-sm font-medium text-docker-text mb-2">
                            留言内容 <span class="text-red-500">*</span>
                        </label>
                        <textarea id="message" name="message" required rows="5"
                                  placeholder="请输入您的留言内容..."
                                  class="w-full px-4 py-2.5 rounded-lg border border-docker-border focus:border-docker-blue focus:ring-2 focus:ring-docker-blue/20 outline-none transition-all placeholder-gray-400 resize-none"></textarea>
                    </div>
                    
                    <button type="submit" id="submit-btn"
                            class="w-full bg-docker-blue text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span id="submit-text">提交留言</span>
                    </button>
                </form>
                
                <div id="form-message" class="mt-6 hidden p-4 rounded-lg text-center text-sm"></div>
            </div>
        </div>
    </section>

    <!-- 留言列表区域 -->
    <section class="py-12 px-6 bg-gray-50/50">
        <div class="container mx-auto max-w-4xl">
            <div class="flex items-center gap-3 mb-10 justify-center">
                <h2 class="text-2xl font-bold text-docker-darkBlue">留言列表</h2>
                <span class="bg-docker-lightBlue text-docker-blue px-3 py-1 rounded-full text-xs font-bold" id="comments-count">0</span>
            </div>
            
            <div id="comments-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 留言将通过 JavaScript 动态加载 -->
                <div class="text-center py-12 text-docker-gray col-span-full">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p>加载留言中...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-docker-border py-12 px-6 mt-12">
        <div class="container mx-auto text-center">
            <p class="text-docker-gray text-sm">
                © 2025 个人主页
            </p>
        </div>
    </footer>

    <!-- 留言板功能脚本 -->
    <script>
        // 初始化 ScrollReveal
        ScrollReveal().reveal('.reveal-element', {
            distance: '20px',
            origin: 'bottom',
            duration: 800,
            interval: 100,
            cleanup: true
        });

        // 模拟留言数据（实际项目中应连接后端API）
        const mockComments = [
            {
                name: "Docker User",
                date: "2025-02-09",
                content: "这个新的 Docker 风格界面看起来非常专业！简洁大气，很符合开发者的审美。",
                avatar_color: "bg-blue-500"
            },
            {
                name: "Web Developer",
                date: "2025-02-08",
                content: "Jinja2 模板生成的静态页面性能很好，加载速度很快。期待看到更多内容更新！",
                avatar_color: "bg-green-500"
            },
            {
                name: "访客",
                date: "2025-02-07",
                content: "网站结构很清晰，文档部分很有帮助。",
                avatar_color: "bg-purple-500"
            }
        ];

        // 渲染留言列表
        function renderComments() {
            const list = document.getElementById('comments-list');
            const count = document.getElementById('comments-count');
            
            // 更新计数
            count.textContent = mockComments.length;
            
            // 清空列表
            list.innerHTML = '';
            
            // 生成HTML
            mockComments.forEach((comment, index) => {
                const delay = index * 100;
                const html = `
                    <div class="bg-white border border-docker-border rounded-lg p-6 hover:shadow-md transition-shadow reveal-comment" style="animation-delay: ${delay}ms">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 ${comment.avatar_color} rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0">
                                ${comment.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-docker-text truncate">${comment.name}</h3>
                                    <span class="text-xs text-docker-gray whitespace-nowrap">${comment.date}</span>
                                </div>
                                <p class="text-docker-text/80 text-sm leading-relaxed break-words">
                                    ${comment.content}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', html);
            });
            
            // 重新初始化新元素的动画
            ScrollReveal().reveal('.reveal-comment', {
                distance: '10px',
                origin: 'bottom',
                duration: 600,
                interval: 100
            });
        }

        // 处理表单提交
        document.getElementById('guestbook-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            const messageDiv = document.getElementById('form-message');
            
            // 禁用按钮
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 提交中...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            // 获取表单数据
            const name = document.getElementById('name').value;
            const content = document.getElementById('message').value;
            
            // 模拟API调用
            setTimeout(() => {
                // 添加新留言
                mockComments.unshift({
                    name: name,
                    date: new Date().toISOString().split('T')[0],
                    content: content,
                    avatar_color: "bg-indigo-500"
                });
                
                // 重新渲染列表
                renderComments();
                
                // 显示成功消息
                messageDiv.innerHTML = '<i class="fa-solid fa-check-circle text-green-500 mr-2"></i> 留言提交成功！感谢您的反馈。';
                messageDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600');
                messageDiv.classList.add('bg-green-50', 'text-green-600', 'border', 'border-green-200');
                messageDiv.classList.remove('hidden');
                
                // 重置表单
                this.reset();
                
                // 恢复按钮
                btn.disabled = false;
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                
                // 3秒后隐藏消息
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 3000);
                
            }, 1000);
        });

        // 页面加载时渲染留言
        document.addEventListener('DOMContentLoaded', renderComments);
    </script>
</body>
</html>
