<!-- 顶部导航栏（Docker风格：全宽、白色、简洁） -->
<nav id="main-nav" class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100 transition-all duration-200 pt-[env(safe-area-inset-top)]" role="navigation" aria-label="主导航">
    <div class="container mx-auto px-4 md:px-8 min-h-16 md:min-h-20 h-16 md:h-20 flex items-center justify-between">
        <!-- Logo -->
        <a href="#" class="flex items-center text-docker-blue hover:text-docker-hover transition-colors duration-200 cursor-pointer group rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2">
            <i class="fa-brands fa-docker text-3xl md:text-4xl mr-2" aria-hidden="true"></i>
            <span class="text-xl md:text-2xl font-bold text-docker-dark group-hover:text-docker-blue transition-colors duration-200">{{ nav_logo }}</span>
        </a>

        <!-- 桌面端菜单 -->
        <div class="hidden lg:flex items-center space-x-6 xl:space-x-8">
            {% for item in nav_items %}
            <a href="{{ item.href }}" class="text-sm font-medium text-gray-600 hover:text-docker-blue transition-colors duration-200 cursor-pointer rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2 py-1" data-i18n-key="nav.{{ item.id }}">{{ item.title }}</a>
            {% endfor %}
        </div>

        <!-- 右侧操作区 -->
        <div class="hidden lg:flex items-center space-x-4">
            <!-- 搜索 -->
            <button id="search-btn" class="text-gray-500 hover:text-docker-blue transition-colors duration-200 cursor-pointer p-2 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2" aria-label="搜索">
                <i class="fa-solid fa-magnifying-glass text-lg" aria-hidden="true"></i>
            </button>
            
            <!-- 分割线 -->
            <div class="h-6 w-px bg-gray-200" aria-hidden="true"></div>

            <!-- 登录（模拟） -->
            <a href="#" class="text-sm font-medium text-gray-600 hover:text-docker-blue transition-colors duration-200 cursor-pointer rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2 px-2 py-1">Sign In</a>

            <!-- CTA 按钮 -->
            <a href="#project" class="bg-docker-blue text-white px-5 py-2.5 rounded text-sm font-medium hover:bg-docker-hover transition-all duration-200 cursor-pointer shadow-sm hover:shadow-md rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2">
                Get Started
            </a>
            
            <!-- 语言切换 -->
            <div class="relative">
                <button id="lang-toggle" type="button" class="flex items-center gap-1.5 text-gray-600 hover:text-docker-blue px-3 py-2 rounded-lg border border-transparent hover:border-gray-200 hover:bg-gray-50 transition-all duration-200 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2" aria-label="切换语言" aria-haspopup="true" aria-expanded="false">
                    <i class="fa-solid fa-globe text-base" aria-hidden="true"></i>
                    <span id="lang-toggle-label" class="text-sm font-medium">中文</span>
                    <i class="fa-solid fa-chevron-down text-xs text-gray-400 transition-transform duration-200 lang-chevron" aria-hidden="true"></i>
                </button>
                <div id="lang-menu" class="hidden absolute right-0 top-full pt-2 w-36 z-50" role="menu">
                    <div class="bg-white border border-gray-200 shadow-xl rounded-lg py-1 overflow-hidden">
                        <button type="button" role="menuitem" class="lang-option w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-docker-light hover:text-docker-blue transition-colors duration-200 cursor-pointer flex items-center justify-between gap-2 first:rounded-t-lg last:rounded-b-lg" data-lang="zh">
                            <span>中文</span>
                            <i class="fa-solid fa-check lang-check text-docker-blue text-xs opacity-0" aria-hidden="true"></i>
                        </button>
                        <button type="button" role="menuitem" class="lang-option w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-docker-light hover:text-docker-blue transition-colors duration-200 cursor-pointer flex items-center justify-between gap-2 first:rounded-t-lg last:rounded-b-lg" data-lang="en">
                            <span>English</span>
                            <i class="fa-solid fa-check lang-check text-docker-blue text-xs opacity-0" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移动端菜单按钮（44px 最小触摸目标） -->
        <div class="lg:hidden flex items-center space-x-2">
            <button id="mobile-search-btn" type="button" class="text-gray-500 cursor-pointer min-w-[44px] min-h-[44px] flex items-center justify-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2" aria-label="搜索">
                <i class="fa-solid fa-magnifying-glass text-lg" aria-hidden="true"></i>
            </button>
            <button id="menu-btn" type="button" class="text-gray-500 cursor-pointer min-w-[44px] min-h-[44px] flex items-center justify-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue focus-visible:ring-offset-2" aria-label="打开菜单">
                <i class="fa-solid fa-bars text-xl" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- 搜索框容器（绝对定位） -->
    <div id="search-container" class="hidden absolute left-0 right-0 top-full bg-white border-b border-gray-100 shadow-lg p-4">
        <div class="container mx-auto max-w-3xl relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="search-input" class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-docker-blue focus:border-docker-blue focus:bg-white transition-colors duration-200" placeholder="How can we help?" aria-label="搜索内容">
            <div id="search-results" class="mt-4 max-h-96 overflow-y-auto hidden"></div>
        </div>
    </div>

    <!-- 移动端菜单 -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-gray-100 absolute top-full left-0 right-0 shadow-lg">
        <div class="p-4 space-y-2">
            {% for item in nav_items %}
            <a href="{{ item.href }}" class="block px-4 py-3 text-base font-medium text-gray-600 hover:bg-gray-50 hover:text-docker-blue rounded-lg transition-colors duration-200 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-docker-blue" data-i18n-key="nav.{{ item.id }}">{{ item.title }}</a>
            {% endfor %}
            <div class="border-t border-gray-100 my-2 pt-2">
                <div class="px-4 py-2 flex items-center gap-2">
                    <span class="text-sm text-gray-500" data-i18n-key="nav.language">语言</span>
                    <button type="button" class="lang-option-mobile flex-1 px-3 py-2 text-sm font-medium rounded-lg border transition-colors" data-lang="zh">中文</button>
                    <button type="button" class="lang-option-mobile flex-1 px-3 py-2 text-sm font-medium rounded-lg border transition-colors" data-lang="en">English</button>
                </div>
                <a href="#" class="block px-4 py-3 text-base font-medium text-gray-600 hover:bg-gray-50 rounded-lg transition-colors duration-200 cursor-pointer">Sign In</a>
                <a href="#project" class="block px-4 py-3 text-base font-medium text-docker-blue hover:bg-blue-50 rounded-lg transition-colors duration-200 cursor-pointer">Get Started</a>
            </div>
        </div>
    </div>
</nav>
<div class="min-h-[calc(4rem+env(safe-area-inset-top))] md:min-h-[calc(5rem+env(safe-area-inset-top))]"></div> <!-- 占位符，与 nav 同高（含 safe-area） -->
