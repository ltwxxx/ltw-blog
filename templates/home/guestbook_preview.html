<!-- 留言板预览区域 -->
<section id="guestbook" class="py-12 md:py-20 bg-white relative overflow-hidden border-t border-docker-border">
    <div class="absolute inset-0 bg-dotted-pattern bg-[length:20px_20px] opacity-30"></div>
    <div class="container mx-auto px-4 md:px-8 max-w-6xl relative z-10">
        <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold mb-3 md:mb-4 text-center reveal-element text-docker-dark" data-i18n-key="sections.guestbook.title">
            {{ title }}
        </h2>
        <p class="text-docker-gray text-sm md:text-base text-center mb-8 md:mb-12 px-4 reveal-element" data-sr-delay="100" data-i18n-key="sections.guestbook.subtitle">
            {{ subtitle }}
        </p>

        <!-- 留言板预览卡片 -->
        <div class="bg-white rounded-lg border border-docker-border p-6 md:p-8 lg:p-12 reveal-element shadow-sm hover:shadow-lg transition-shadow duration-300" data-sr-delay="200">
            <div class="text-center mb-6 md:mb-8">
                <div class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-4 md:mb-6 rounded-lg bg-blue-50 flex items-center justify-center border border-docker-blue/20">
                    <i class="fa-solid fa-comments text-2xl md:text-3xl text-docker-blue"></i>
                </div>
                <h3 class="text-xl md:text-2xl lg:text-3xl font-bold text-docker-dark mb-2 md:mb-3" data-i18n-key="sections.guestbook.welcome">欢迎留言</h3>
                <p class="text-docker-gray text-sm md:text-base lg:text-lg px-2" data-i18n-key="sections.guestbook.description">分享您的想法、建议或问题，我会认真阅读每一条留言</p>
            </div>
            
            <div class="text-center">
                <a href="guestbook/index.html" 
                   class="inline-flex items-center px-6 py-3 md:px-8 md:py-4 bg-docker-blue text-white rounded-md font-medium text-base md:text-lg hover:bg-docker-hover active:bg-blue-700 transition-all shadow-md hover:shadow-lg touch-manipulation">
                    <i class="fa-solid fa-arrow-right mr-2 text-sm md:text-base"></i>
                    <span data-i18n-key="sections.guestbook.button">前往留言板</span>
                </a>
            </div>
        </div>
    </div>
</section>
