<!-- 技术栈预览区域 -->
<section id="stack" class="py-12 md:py-20 bg-white relative overflow-hidden border-t border-docker-border">
    <div class="absolute inset-0 bg-dotted-pattern bg-[length:20px_20px] opacity-30"></div>
    <div class="container mx-auto px-4 md:px-8 max-w-6xl relative z-10">
        <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold mb-3 md:mb-4 text-center reveal-element text-docker-dark" data-i18n-key="sections.stack.title">
            {{ title }}
        </h2>
        <p class="text-docker-gray text-sm md:text-base text-center mb-8 md:mb-12 px-4 reveal-element" data-sr-delay="100" data-i18n-key="sections.stack.subtitle">
            {{ subtitle }}
        </p>

        <!-- 技术栈网格 -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-4 lg:gap-6 reveal-element" data-sr-delay="200">
            {% for tech_name, skills in stack_data.items() %}
            <div class="group bg-white rounded-lg border border-docker-border p-3 md:p-4 lg:p-6 transition-all duration-300 hover:shadow-lg hover:border-docker-blue/30 touch-manipulation flex flex-col h-full">
                <!-- 技术名称和图标 -->
                <div class="flex items-center justify-center mb-3 md:mb-4">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-lg bg-blue-50 flex items-center justify-center mr-2 md:mr-3 group-hover:bg-blue-100 transition-colors shrink-0">
                        <i class="{{ icon_map.get(tech_name, 'fas fa-code') }} text-sm md:text-base text-docker-blue"></i>
                    </div>
                    <h3 class="text-sm md:text-base font-semibold text-docker-dark capitalize group-hover:text-docker-blue transition-colors">
                        {{ tech_name }}
                    </h3>
                </div>

                <!-- 技能列表 -->
                <div class="space-y-1 md:space-y-2 flex-grow">
                    {% for skill in skills[:3] %}  <!-- 只显示前3个技能 -->
                    <div class="flex items-center">
                        <div class="w-1.5 h-1.5 bg-docker-blue rounded-full mr-2 flex-shrink-0"></div>
                        <span class="text-xs md:text-sm text-docker-gray truncate">{{ skill }}</span>
                    </div>
                    {% endfor %}
                    {% if skills|length > 3 %}
                    <div class="text-xs text-docker-gray/70 text-center mt-2 group-hover:text-docker-blue transition-colors">
                        +{{ skills|length - 3 }} 更多
                    </div>
                    {% else %}
                    <!-- 占位符，保持高度一致 -->
                    <div class="text-xs text-transparent text-center mt-2 select-none">
                        &nbsp;
                    </div>
                    {% endif %}
                </div>

                <!-- 技能数量 -->
                <div class="mt-3 md:mt-4 pt-2 md:pt-3 border-t border-docker-border">
                    <div class="text-center">
                        <span class="text-xs text-docker-gray">{{ skills|length }} 项技能</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
