<!-- 文档预览区域 -->
<section id="docs" class="py-20 bg-docker-light border-t border-docker-border relative overflow-hidden">
    <div class="absolute inset-0 bg-dotted-pattern bg-[length:20px_20px] opacity-30"></div>
    <div class="container mx-auto px-4 md:px-8 max-w-6xl relative z-10">
        <div class="text-center">
            <h2 class="text-3xl md:text-4xl font-bold mb-4 text-center reveal-element text-docker-dark" data-i18n-key="sections.docs.title">
                {{ title }}
            </h2>
            <p class="text-docker-gray text-center mb-12 reveal-element" data-sr-delay="100" data-i18n-key="sections.docs.subtitle">
                {{ subtitle }}
            </p>

            <!-- 跳转按钮 -->
            <div class="reveal-element" data-sr-delay="200">
                <a href="{{ docs_url }}" class="inline-block bg-docker-blue text-white px-8 py-4 rounded-md text-lg hover:bg-docker-hover transition-all transform hover:translate-y-[-2px] shadow-md hover:shadow-lg">
                    <i class="fa-solid fa-folder-open mr-3"></i>
                    <span data-i18n-key="sections.docs.browse_docs">浏览文档</span>
                    <i class="fa-solid fa-arrow-right ml-3"></i>
                </a>
            </div>
        </div>
    </div>
</section>
